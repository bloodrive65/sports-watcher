<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sports Watcher · NFL Live Scores</title>
<meta name="description" content="Live NFL scores, game clock, quarter, down and distance.">
<meta name="theme-color" content="#120c09">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sports Watcher">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.v6.css">
<script>
  // Embedded on another site (e.g. Wix)? Go transparent so the host page shows through.
  // Optional: ?bg=1e1e22 forces a solid background color instead.
  (function () {
    var q = new URLSearchParams(location.search), d = document.documentElement;
    var framed = false; try { framed = window.self !== window.top; } catch (e) { framed = true; }
    if (framed || q.has("embed")) d.classList.add("embed");
    var bg = q.get("bg"); if (bg && /^[0-9a-f]{3,8}$/i.test(bg)) d.style.setProperty("--page-bg", "#" + bg);
    if (q.get("header") === "0") d.classList.add("no-header");
  })();
</script>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg class="logo" viewBox="0 0 32 32" fill="none" aria-label="NFL Scores logo">
      <ellipse cx="16" cy="16" rx="13" ry="8" fill="#2f6feb"/>
      <path d="M10 16h12M13 13.5v5M16 13.5v5M19 13.5v5" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    <div>
      <h1>Live Scores</h1>
      <p id="week" class="sub">Loading…</p>
    </div>
  </div>
  <div class="controls">
    <label class="sr" for="fav">Favorite team</label>
    <select id="fav"><option value="">★ Pin a team</option></select>
    <button id="refresh" aria-label="Refresh scores" title="Refresh">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg>
    </button>
  </div>
</header>

<nav class="tabs" role="tablist">
  <button class="tab active" data-filter="all">All</button>
  <button class="tab" data-filter="in">Live</button>
  <button class="tab" data-filter="pre">Upcoming</button>
  <button class="tab" data-filter="post">Final</button>
</nav>

<main id="games" aria-live="polite">
  <div class="card skeleton"></div><div class="card skeleton"></div><div class="card skeleton"></div>
</main>

<footer class="foot">
  <span id="updated">—</span>
  <span>Data: ESPN</span>
</footer>

<script src="app.v2.js"></script>
</body>
</html>
